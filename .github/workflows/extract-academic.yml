name: Extract academic sources

on:
  push:
    branches: [finalizacao-academica-2026]
    paths-ignore:
      - 'docs/_extracted/**'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: finalizacao-academica-2026
      - name: Instalar pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Extrair conteúdo dos artefatos acadêmicos
        run: python3 tools/extract_academic_sources.py
      - name: Publicar extração temporária
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_extracted
          if git diff --cached --quiet; then
            echo "Sem alterações na extração."
          else
            git commit -m "chore: atualiza extração temporária para auditoria"
            git push origin HEAD:finalizacao-academica-2026
          fi
