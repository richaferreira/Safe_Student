name: Finalizar binarios academicos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[rebuild-final-binaries]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias DOCX/PDF
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer

      - name: Corrigir sumarios estaticos V1.1
        run: python tools/finalize_binary_docs.py

      - name: Regenerar PDFs finais
        run: |
          mkdir -p /tmp/safe-student-pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/safe-student-pdf \
            01_Plano_Gerenciamento_Unificado_Safe_Student.docx \
            02_Especificacao_Requisitos_UML_DER_Safe_Student.docx \
            03_Artigo_Safe_Student_ABNT.docx \
            04_Plano_Relatorio_Testes_Safe_Student.docx \
            05_Relatorio_Pesquisa_Campo_Extensionista_Safe_Student.docx
          cp /tmp/safe-student-pdf/*.pdf .

      - name: Commitar binarios finais
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            01_Plano_Gerenciamento_Unificado_Safe_Student.docx \
            01_Plano_Gerenciamento_Unificado_Safe_Student.pdf \
            02_Especificacao_Requisitos_UML_DER_Safe_Student.docx \
            02_Especificacao_Requisitos_UML_DER_Safe_Student.pdf \
            03_Artigo_Safe_Student_ABNT.pdf \
            04_Plano_Relatorio_Testes_Safe_Student.docx \
            04_Plano_Relatorio_Testes_Safe_Student.pdf \
            05_Relatorio_Pesquisa_Campo_Extensionista_Safe_Student.docx \
            05_Relatorio_Pesquisa_Campo_Extensionista_Safe_Student.pdf
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração binária necessária.'
          else
            git commit -m 'docs: publica binarios finais V1.1'
            git push origin HEAD:main
          fi
