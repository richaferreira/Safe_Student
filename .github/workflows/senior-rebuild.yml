name: Revisao senior - requisitos e diagramas

on:
  push:
    branches: [revisao-senior-uml-requisitos]

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[senior-rebuild]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de documentos e diagramas
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx python-pptx cairosvg
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-impress zip

      - name: Gerar diagramas formais
        run: python tools/build_diagrams_v2.py

      - name: Aplicar refatoracao do backend
        run: python tools/apply_senior_refactor.py

      - name: Remover base mutavel versionada
        run: git rm -f Safe_Student_MVP/data/db.json || true

      - name: Gerar especificacao V2
        run: python tools/build_spec_v2.py

      - name: Corrigir documentos e apresentacao
        run: python tools/patch_academic_v2.py

      - name: Converter DOCX alterados para PDF
        run: |
          mkdir -p /tmp/safe-student-v2-pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/safe-student-v2-pdf \
            01_Plano_Gerenciamento_Unificado_Safe_Student.docx \
            02_Especificacao_Requisitos_UML_DER_Safe_Student.docx \
            04_Plano_Relatorio_Testes_Safe_Student.docx \
            06_Relatorio_Auditoria_Conformidade_Safe_Student.docx \
            10_Manual_Usuario_Implantacao_Treinamento_Suporte.docx
          cp /tmp/safe-student-v2-pdf/*.pdf .

      - name: Gerar PDF de QA dos slides
        run: |
          mkdir -p /tmp/safe-student-slides-qa
          libreoffice --headless --convert-to pdf --outdir /tmp/safe-student-slides-qa 08_Apresentacao_Final_Safe_Student.pptx

      - name: Validar sintaxe e testes
        working-directory: Safe_Student_MVP
        run: |
          node --check server.js
          node --check public/app.js
          npm test

      - name: Regenerar pacote ZIP do MVP
        run: |
          rm -f 09_Safe_Student_MVP_codigo.zip
          zip -rq 09_Safe_Student_MVP_codigo.zip Safe_Student_MVP \
            -x 'Safe_Student_MVP/data/db.runtime.json' \
               'Safe_Student_MVP/.tmp/*'

      - name: Publicar artefatos de QA
        uses: actions/upload-artifact@v4
        with:
          name: qa-revisao-senior-v2
          if-no-files-found: error
          path: |
            01_Plano_Gerenciamento_Unificado_Safe_Student.pdf
            02_Especificacao_Requisitos_UML_DER_Safe_Student.pdf
            04_Plano_Relatorio_Testes_Safe_Student.pdf
            06_Relatorio_Auditoria_Conformidade_Safe_Student.pdf
            08_Apresentacao_Final_Safe_Student.pptx
            10_Manual_Usuario_Implantacao_Treinamento_Suporte.pdf
            docs/diagramas/*.png
            /tmp/safe-student-slides-qa/08_Apresentacao_Final_Safe_Student.pdf

      - name: Commitar revisao V2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada.'
          else
            git commit -m 'refactor: revisao senior V2 de requisitos, UML, DER e privacidade'
            git push origin HEAD:revisao-senior-uml-requisitos
          fi
