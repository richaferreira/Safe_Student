name: Revisao senior - requisitos e diagramas

on:
  push:
    branches: [revisao-senior-uml-requisitos]

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[senior-rebuild]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de documentos e diagramas
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx python-pptx cairosvg
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-impress zip

      - name: Reconstruir V2 e registrar diagnostico
        run: |
          set +e
          mkdir -p docs/build-logs /tmp/safe-student-v2-pdf /tmp/safe-student-slides-qa
          : > docs/build-logs/rebuild-v2-status.txt

          run_step() {
            name="$1"
            shift
            echo "===== $name =====" >> docs/build-logs/rebuild-v2-status.txt
            "$@" >> docs/build-logs/rebuild-v2-status.txt 2>&1
            code=$?
            echo "STATUS=$code" >> docs/build-logs/rebuild-v2-status.txt
            echo >> docs/build-logs/rebuild-v2-status.txt
            return 0
          }

          run_step diagramas python tools/build_diagrams_v2.py
          run_step backend python tools/apply_senior_refactor.py
          git rm -f Safe_Student_MVP/data/db.json >> docs/build-logs/rebuild-v2-status.txt 2>&1 || true
          run_step especificacao python tools/build_spec_v2.py
          run_step documentos python tools/patch_academic_v2.py

          echo "===== pdfs =====" >> docs/build-logs/rebuild-v2-status.txt
          libreoffice --headless --convert-to pdf --outdir /tmp/safe-student-v2-pdf \
            01_Plano_Gerenciamento_Unificado_Safe_Student.docx \
            02_Especificacao_Requisitos_UML_DER_Safe_Student.docx \
            04_Plano_Relatorio_Testes_Safe_Student.docx \
            06_Relatorio_Auditoria_Conformidade_Safe_Student.docx \
            10_Manual_Usuario_Implantacao_Treinamento_Suporte.docx \
            >> docs/build-logs/rebuild-v2-status.txt 2>&1
          echo "STATUS=$?" >> docs/build-logs/rebuild-v2-status.txt
          cp /tmp/safe-student-v2-pdf/*.pdf . 2>> docs/build-logs/rebuild-v2-status.txt || true

          echo "===== slides-pdf =====" >> docs/build-logs/rebuild-v2-status.txt
          libreoffice --headless --convert-to pdf --outdir /tmp/safe-student-slides-qa \
            08_Apresentacao_Final_Safe_Student.pptx \
            >> docs/build-logs/rebuild-v2-status.txt 2>&1
          echo "STATUS=$?" >> docs/build-logs/rebuild-v2-status.txt

          echo "===== sintaxe-servidor =====" >> docs/build-logs/rebuild-v2-status.txt
          (cd Safe_Student_MVP && node --check server.js) >> docs/build-logs/rebuild-v2-status.txt 2>&1
          echo "STATUS=$?" >> docs/build-logs/rebuild-v2-status.txt

          echo "===== sintaxe-frontend =====" >> docs/build-logs/rebuild-v2-status.txt
          (cd Safe_Student_MVP && node --check public/app.js) >> docs/build-logs/rebuild-v2-status.txt 2>&1
          echo "STATUS=$?" >> docs/build-logs/rebuild-v2-status.txt

          echo "===== testes =====" >> docs/build-logs/rebuild-v2-status.txt
          (cd Safe_Student_MVP && npm test) >> docs/build-logs/rebuild-v2-status.txt 2>&1
          echo "STATUS=$?" >> docs/build-logs/rebuild-v2-status.txt

          echo "===== zip =====" >> docs/build-logs/rebuild-v2-status.txt
          rm -f 09_Safe_Student_MVP_codigo.zip
          zip -rq 09_Safe_Student_MVP_codigo.zip Safe_Student_MVP \
            -x 'Safe_Student_MVP/data/db.runtime.json' \
               'Safe_Student_MVP/.tmp/*' \
            >> docs/build-logs/rebuild-v2-status.txt 2>&1
          echo "STATUS=$?" >> docs/build-logs/rebuild-v2-status.txt

          cp /tmp/safe-student-slides-qa/08_Apresentacao_Final_Safe_Student.pdf docs/build-logs/08_Apresentacao_Final_Safe_Student_QA.pdf 2>/dev/null || true
          cat docs/build-logs/rebuild-v2-status.txt
          exit 0

      - name: Commitar resultados e diagnostico V2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada.'
          else
            git commit -m 'refactor: revisao senior V2 de requisitos, UML, DER e privacidade'
            git push origin HEAD:revisao-senior-uml-requisitos
          fi

      - name: Publicar artefatos de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-revisao-senior-v2
          if-no-files-found: warn
          path: |
            01_Plano_Gerenciamento_Unificado_Safe_Student.pdf
            02_Especificacao_Requisitos_UML_DER_Safe_Student.pdf
            04_Plano_Relatorio_Testes_Safe_Student.pdf
            06_Relatorio_Auditoria_Conformidade_Safe_Student.pdf
            08_Apresentacao_Final_Safe_Student.pptx
            10_Manual_Usuario_Implantacao_Treinamento_Suporte.pdf
            docs/diagramas/*.png
            docs/build-logs/*
