name: Publicar pacote acadêmico V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-v2-binaries]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx python-pptx cairosvg
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-impress zip

      - name: Renderizar SVGs em PNG para os documentos
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for svg in Path('docs/diagramas').glob('*.svg'):
              cairosvg.svg2png(url=str(svg), write_to=str(svg.with_suffix('.png')), output_width=1800)
          PY

      - name: Gerar documentos V2
        run: |
          python tools/patch_plan_v2.py
          python tools/build_spec_v2.py
          python tools/build_test_report_v2.py
          python tools/build_audit_manual_v2.py
          python tools/build_presentation_v2.py

      - name: Gerar PDFs finais
        run: |
          mkdir -p /tmp/safe-student-v2-pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/safe-student-v2-pdf \
            01_Plano_Gerenciamento_Unificado_Safe_Student.docx \
            02_Especificacao_Requisitos_UML_DER_Safe_Student.docx \
            04_Plano_Relatorio_Testes_Safe_Student.docx \
            06_Relatorio_Auditoria_Conformidade_Safe_Student.docx \
            10_Manual_Usuario_Implantacao_Treinamento_Suporte.docx
          cp /tmp/safe-student-v2-pdf/*.pdf .

      - name: Validar código e testes
        working-directory: Safe_Student_MVP
        run: |
          node --check server.js
          node --check public/app.js
          npm test

      - name: Regenerar pacote ZIP do MVP
        run: |
          rm -f 09_Safe_Student_MVP_codigo.zip
          zip -rq 09_Safe_Student_MVP_codigo.zip Safe_Student_MVP \
            -x 'Safe_Student_MVP/data/db.runtime.json' \
               'Safe_Student_MVP/.tmp/*'

      - name: Remover PNGs intermediários dos diagramas
        run: rm -f docs/diagramas/*.png

      - name: Commitar binários V2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            01_Plano_Gerenciamento_Unificado_Safe_Student.docx \
            01_Plano_Gerenciamento_Unificado_Safe_Student.pdf \
            02_Especificacao_Requisitos_UML_DER_Safe_Student.docx \
            02_Especificacao_Requisitos_UML_DER_Safe_Student.pdf \
            04_Plano_Relatorio_Testes_Safe_Student.docx \
            04_Plano_Relatorio_Testes_Safe_Student.pdf \
            06_Relatorio_Auditoria_Conformidade_Safe_Student.docx \
            06_Relatorio_Auditoria_Conformidade_Safe_Student.pdf \
            08_Apresentacao_Final_Safe_Student.pptx \
            09_Safe_Student_MVP_codigo.zip \
            10_Manual_Usuario_Implantacao_Treinamento_Suporte.docx \
            10_Manual_Usuario_Implantacao_Treinamento_Suporte.pdf
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração binária necessária.'
          else
            git commit -m 'docs: publica pacote acadêmico V2 revisado'
            git push origin HEAD:main
          fi
