<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><style>text{font-family:Arial, Helvetica, sans-serif;fill:#111}.title{font-size:20px;font-weight:700}.label{font-size:13px;font-weight:400}.small{font-size:11px;font-weight:400}.boxTitle{font-size:13px;font-weight:700}.attr{font-size:10.5px;font-weight:400}</style><rect width="100%" height="100%" fill="white"/><text x="700.0" y="35" text-anchor="middle" class="title">Diagrama de classes conceitual - comunicação, auditoria e validação</text><rect x="520" y="90" width="300" height="132" fill="white" stroke="#111" stroke-width="1.2"/><line x1="520" y1="122" x2="820" y2="122" stroke="#111" stroke-width="1"/><text x="670.0" y="111" text-anchor="middle" class="boxTitle">Usuario</text><text x="530" y="141" class="attr">id: string/UUID</text><text x="530" y="159" class="attr">nome: string</text><text x="530" y="177" class="attr">email: string</text><text x="530" y="195" class="attr">perfil: PerfilUsuario</text><text x="530" y="213" class="attr">status: string</text><rect x="70" y="430" width="330" height="96" fill="white" stroke="#111" stroke-width="1.2"/><line x1="70" y1="462" x2="400" y2="462" stroke="#111" stroke-width="1"/><text x="235.0" y="451" text-anchor="middle" class="boxTitle">Mensagem</text><text x="80" y="481" class="attr">id: string/UUID</text><text x="80" y="499" class="attr">texto: string</text><text x="80" y="517" class="attr">createdAt: datetime</text><rect x="535" y="430" width="330" height="150" fill="white" stroke="#111" stroke-width="1.2"/><line x1="535" y1="462" x2="865" y2="462" stroke="#111" stroke-width="1"/><text x="700.0" y="451" text-anchor="middle" class="boxTitle">EventoAuditoria</text><text x="545" y="481" class="attr">id: string/UUID</text><text x="545" y="499" class="attr">acao: string</text><text x="545" y="517" class="attr">entidade: string</text><text x="545" y="535" class="attr">entityId: string</text><text x="545" y="553" class="attr">detalhes: string</text><text x="545" y="571" class="attr">createdAt: datetime</text><rect x="1000" y="430" width="340" height="204" fill="white" stroke="#111" stroke-width="1.2"/><line x1="1000" y1="462" x2="1340" y2="462" stroke="#111" stroke-width="1"/><text x="1170.0" y="451" text-anchor="middle" class="boxTitle">FeedbackValidacao</text><text x="1010" y="481" class="attr">id: string/UUID</text><text x="1010" y="499" class="attr">perfil: string</text><text x="1010" y="517" class="attr">cenario: string</text><text x="1010" y="535" class="attr">sucesso: boolean</text><text x="1010" y="553" class="attr">tempoSegundos: number?</text><text x="1010" y="571" class="attr">nota: 1..5</text><text x="1010" y="589" class="attr">comentario: string</text><text x="1010" y="607" class="attr">fonte: DEMO_SEED | APRESENTACAO</text><text x="1010" y="625" class="attr">createdAt: datetime</text><line x1="560" y1="222" x2="185.5" y2="430" stroke="#222" stroke-width="1"/><text x="568" y="240" text-anchor="start" class="small">1</text><text x="193.5" y="422" text-anchor="start" class="small">0..*</text><text x="410" y="325" text-anchor="middle" class="small">envia</text><line x1="620" y1="222" x2="301.0" y2="430" stroke="#222" stroke-width="1"/><text x="628" y="240" text-anchor="start" class="small">1</text><text x="309.0" y="422" text-anchor="start" class="small">0..*</text><text x="485" y="355" text-anchor="middle" class="small">recebe</text><line x1="670.0" y1="222" x2="700.0" y2="430" stroke="#222" stroke-width="1"/><text x="678.0" y="240" text-anchor="start" class="small">1</text><text x="708.0" y="422" text-anchor="start" class="small">0..*</text><text x="685.0" y="319.0" text-anchor="middle" class="small">origina</text><line x1="670.0" y1="222" x2="1170.0" y2="430" stroke="#222" stroke-width="1"/><text x="678.0" y="240" text-anchor="start" class="small">1</text><text x="1178.0" y="422" text-anchor="start" class="small">0..*</text><text x="920.0" y="319.0" text-anchor="middle" class="small">registra</text><text x="700.0" y="730" text-anchor="middle" class="small">Não foram criadas subclasses Responsável/Portaria/Gestão, porque o código usa um único Usuario com atributo perfil.</text></svg>